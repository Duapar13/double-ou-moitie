[package]
name = "double-ou-moitie"
version = "0.1.0"
edition = "2024"
description = "Simulateur du jeu Double ou Moitié : espérance, ruine et critère de Kelly"
license = "MIT"
repository = "https://github.com/Duapar13/double-ou-moitie"

[dependencies]
eframe = { version = "0.34", features = ["persistence"] }
egui_plot = "0.35"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
